name: "Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to add the portable archive to
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-tauri-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build and publish Windows release
        if: ${{ github.event_name == 'push' }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc
          tagName: ${{ github.ref_name }}
          releaseName: "GCT ${{ github.ref_name }}"
          releaseBody: |
            ## GCT ${{ github.ref_name }}

            - Compact, resizable usage pill with a high-contrast Windows tray icon.
            - Tray click restores the widget; the native menu summarizes Copilot and Claude usage.
            - Details stays focused on Copilot, with Claude usage available from the tray.
            - Includes English/French resize feedback and Copilot billing-cycle reset information.

            Download the Windows installer or portable archive below. The portable archive contains `gct.exe` and `WebView2Loader.dll`; Microsoft WebView2 Runtime is required.
          releaseDraft: false

      - name: Build Windows binary for portable archive
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run tauri -- build --no-bundle --target x86_64-pc-windows-msvc

      - name: Package portable Windows archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCT_RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'src-tauri/target/x86_64-pc-windows-msvc/release'
          $exe = Join-Path $releaseDir 'gct.exe'
          if (-not (Test-Path $exe)) { throw "Missing Windows executable: $exe" }

          $portableDir = Join-Path $env:RUNNER_TEMP 'GCT-portable'
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item $exe $portableDir

          $loader = Get-ChildItem -Path $releaseDir -Filter 'WebView2Loader.dll' -File -Recurse | Select-Object -First 1
          if (-not $loader) { throw 'WebView2Loader.dll was not produced by the Windows build.' }
          Copy-Item $loader.FullName $portableDir

          $runtime = Get-ChildItem -Path $releaseDir -Filter 'libunwind.dll' -File -Recurse | Select-Object -First 1
          if ($runtime) { Copy-Item $runtime.FullName $portableDir }

          $version = $env:GCT_RELEASE_TAG -replace '^v', ''
          $archive = Join-Path $env:RUNNER_TEMP "GCT-$version-windows-x64.zip"
          Compress-Archive -Path (Join-Path $portableDir '*') -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksum = Join-Path $env:RUNNER_TEMP "GCT-$version-windows-x64.zip.sha256"
          "$hash  $(Split-Path $archive -Leaf)" | Set-Content -Path $checksum -Encoding ascii
          gh release upload $env:GCT_RELEASE_TAG $archive $checksum --repo $env:GITHUB_REPOSITORY --clobber

  build-tauri-macos:
    if: ${{ vars.ENABLE_MAC_RELEASE == 'true' }}
    needs: build-tauri-windows
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"

    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Import Apple Developer Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify Certificate
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # install the explicit rust target(s) for this job (comma separated if needed)
          targets: ${{ matrix.rust_target }}

      - name: Ensure rustup target is added (explicit)
        run: |
          rustup target add ${{ matrix.rust_target }} || true

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
        with:
          args: ${{ matrix.args }}
          # Without an explicit tagName the action logs "No releaseId or tagName
          # provided, skipping all uploads..." and the bundles never reach the release.
          tagName: ${{ github.ref_name }}
          releaseName: "GCT ${{ github.ref_name }}"
          releaseBody: |
            ## GCT ${{ github.ref_name }}

            - Compact, resizable usage pill with a high-contrast tray icon.
            - Tray click restores the widget; the native menu summarizes usage.
            - Includes localized resize feedback and billing-cycle information.
          releaseDraft: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}-${{ matrix.rust_target }}
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/**/release/bundle/**/*
          if-no-files-found: error
